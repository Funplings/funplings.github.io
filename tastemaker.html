<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Fraunces:opsz,wght@9..144,300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=paintings-64">
    <title>Matthew Guo — Tastemaker</title>
    <style>
        .works-section {
            padding-top: 48px;
        }

        .bookshelf-section {
            margin-bottom: 80px;
        }

        .bookshelf-intro {
            max-width: 720px;
            margin-bottom: 48px;
        }

        .bookshelf-scroll {
            overflow-x: auto;
            padding: 18px 12px 34px;
            scrollbar-color: rgba(90, 57, 27, 0.45) transparent;
        }

        .bookshelf {
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, 160px);
            align-items: end;
            justify-content: space-between;
            gap: 42px;
            min-width: 880px;
            min-height: 350px;
            padding: 46px 58px 42px;
            box-sizing: border-box;
            background:
                linear-gradient(rgba(63, 34, 15, 0.42), rgba(108, 62, 26, 0.25)),
                url("src/assets/images/textures/wood-pattern.png"),
                #8f5628;
            background-size: auto, 320px auto, auto;
            border: 1px solid #24150b;
            box-shadow:
                inset 0 0 0 2px rgba(226, 174, 100, 0.34),
                inset 0 20px 30px rgba(42, 24, 11, 0.28),
                inset 0 -25px 30px rgba(43, 24, 10, 0.32),
                0 14px 24px rgba(45, 29, 14, 0.24);
        }

        .bookshelf::before {
            content: "";
            position: absolute;
            z-index: 2;
            left: 0;
            right: 0;
            bottom: 17px;
            height: 20px;
            background:
                linear-gradient(to bottom, rgba(255, 220, 159, 0.26), transparent 30%, rgba(48, 25, 9, 0.28)),
                url("src/assets/images/textures/wood-pattern.png"),
                #a66b34;
            background-size: auto, 300px auto, auto;
            border-top: 1px solid #24150b;
            border-bottom: 1px solid #24150b;
            box-shadow: 0 -8px 14px rgba(35, 19, 7, 0.3);
        }

        .bookshelf::after {
            content: "";
            position: absolute;
            z-index: 3;
            left: -16px;
            right: -16px;
            bottom: -14px;
            height: 32px;
            background:
                linear-gradient(to bottom, rgba(255, 220, 159, 0.34), transparent 25%, rgba(52, 27, 10, 0.38)),
                url("src/assets/images/textures/wood-pattern.png"),
                #a96d35;
            background-size: auto, 300px auto, auto;
            border: 1px solid #24150b;
            box-shadow:
                inset 0 2px 0 rgba(247, 205, 139, 0.4),
                0 9px 12px rgba(43, 27, 13, 0.34);
        }

        .book {
            position: relative;
            z-index: 1;
            display: block;
            width: 160px;
            height: auto;
            padding: 0;
            box-sizing: border-box;
            border: 1px solid rgba(47, 28, 13, 0.72);
            border-radius: 2px 4px 4px 2px;
            background: transparent;
            box-shadow:
                3px 2px 0 rgba(255, 255, 255, 0.16),
                7px 9px 9px rgba(32, 17, 6, 0.46),
                12px 16px 18px rgba(32, 17, 6, 0.22);
            cursor: pointer;
            transition: transform 0.22s ease, filter 0.22s ease, box-shadow 0.22s ease;
        }

        .book:hover,
        .book:focus-visible {
            z-index: 4;
            filter: brightness(1.08) saturate(1.05);
            transform: translateY(-10px) scale(1.025);
            box-shadow:
                3px 2px 0 rgba(255, 255, 255, 0.2),
                10px 15px 14px rgba(32, 17, 6, 0.48),
                16px 22px 24px rgba(32, 17, 6, 0.25);
        }

        .book:focus-visible {
            outline: 2px solid #f0ddb7;
            outline-offset: 5px;
        }

        .book::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            border-radius: inherit;
            background: linear-gradient(105deg, rgba(255, 255, 255, 0.18), transparent 22%, transparent 78%, rgba(0, 0, 0, 0.1));
        }

        .book img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: inherit;
        }

        .book-modal-panel {
            position: relative;
            display: grid;
            grid-template-columns: minmax(220px, 340px) minmax(280px, 460px);
            gap: 42px;
            width: min(880px, calc(100vw - 48px));
            max-height: calc(100vh - 64px);
            padding: 34px;
            box-sizing: border-box;
            overflow-y: auto;
            color: #202d23;
            background: rgba(224, 236, 197, 0.97);
            border: 1px solid rgba(22, 32, 24, 0.8);
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.48);
        }

        .book-modal-cover {
            display: block;
            width: 100%;
            max-height: calc(100vh - 132px);
            object-fit: contain;
            align-self: center;
            box-shadow: 8px 10px 18px rgba(30, 24, 16, 0.3);
        }

        .book-modal-details {
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 8px 0 2px;
        }

        .book-modal-title {
            margin: 0 0 8px;
            font-family: "Fraunces", serif;
            font-size: 34px;
            font-weight: 500;
            line-height: 1.08;
        }

        .book-modal-meta {
            margin: 0 0 26px;
            font-size: 18px;
            font-style: italic;
            opacity: 0.82;
        }

        .book-modal-description {
            margin: 0 0 32px;
            line-height: 1.45;
        }

        .book-modal-description a {
            color: inherit;
            text-underline-offset: 3px;
        }

        .book-modal-link {
            align-self: flex-start;
            margin-top: auto;
            color: #202d23;
            font-family: "Fraunces", serif;
            font-size: 18px;
            font-weight: 500;
            text-underline-offset: 4px;
        }

        @media (max-width: 768px) {
            .bookshelf-intro {
                margin-bottom: 28px;
            }

            .bookshelf-scroll {
                margin: 0 -16px;
                padding-left: 16px;
                padding-right: 16px;
            }

            .book-modal-panel {
                display: block;
                width: calc(100vw - 28px);
                max-height: calc(100vh - 36px);
                padding: 26px 22px;
            }

            .book-modal-cover {
                width: min(260px, 100%);
                max-height: 48vh;
                margin: 0 auto 28px;
            }

            .book-modal-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="site-header"></div>
    </div>

    <div class="works-section">
        <div class="container">
            <p>Work in progress. More to come soon!</p>
            <section class="bookshelf-section">
                <div class="section-heading">Books</div>
                <div class="bookshelf-scroll">
                    <div class="bookshelf">
                        <button class="book book--friendly" type="button"
                            data-title="Friendly Ambitious Nerd"
                            data-year="2022"
                            data-author="Visakan Veerasamy"
                            data-link="https://gum.co/FANbook"
                            data-link-label="View on Gumroad"
                            data-description-html='A collection of essays by Visakan Veerasamy (<a href="https://twitter.com/visakanv" target="_blank" rel="noopener">@visakanv</a>). My elevator pitch is that it&apos;s the <em>How To Make Friends and Influence People</em> of the digital age. If you fancy yourself a friendly ambitious nerd, or even an aspiring one, this is probably one of the highest ROI things you can read.'>
                            <img src="src/assets/images/books/friendly-ambitious-nerd.jpg" alt="Friendly Ambitious Nerd by Visakan Veerasamy">
                        </button>

                        <button class="book book--stoner" type="button"
                            data-title="Stoner"
                            data-year="1965"
                            data-author="John Williams"
                            data-link="https://en.wikipedia.org/wiki/Stoner_(novel)"
                            data-link-label="Learn more"
                            data-description="Relatively short, very straightforwardly written, and devastating in its depiction of a man who doesn't quite live up to his potential. A cautionary tale about the dangers of excessive stoicism, yet simultaneously celebration of the mundane little joys in life.">
                            <img src="src/assets/images/books/stoner.jpg" alt="Stoner by John Williams">
                        </button>

                        <button class="book book--remains" type="button"
                            data-title="The Remains of the Day"
                            data-year="1989"
                            data-author="Kazuo Ishiguro"
                            data-link="https://en.wikipedia.org/wiki/The_Remains_of_the_Day"
                            data-link-label="Learn more"
                            data-description="Ishiguro excels at writing from the point of a view of a character so mired in their inner life that they fail to see what's happening in their actual life until it's too late.">
                            <img src="src/assets/images/books/remains-of-the-day.jpg" alt="The Remains of the Day by Kazuo Ishiguro">
                        </button>

                        <button class="book book--determined" type="button"
                            data-title="Determined: A Science of Life Without Free Will"
                            data-year="2023"
                            data-author="Robert Sapolsky"
                            data-link="https://en.wikipedia.org/wiki/Determined%3A_A_Science_of_Life_Without_Free_Will"
                            data-link-label="Learn more"
                            data-description="Sapolsky is the rare combination of a brilliant mind and an incredibly deft communicator. I don't think all his arguments hold up, but it's a fantastic primer on basic human behavioral biology, the philosophy of free will and determinism, and a bold, thought-provoking argument for a radically new theory of justice.">
                            <img src="src/assets/images/books/determined.jpg" alt="Determined by Robert Sapolsky">
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <div id="book-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="book-modal-title">
        <span class="modal-close" role="button" tabindex="0" aria-label="Close book details">&times;</span>
        <div class="book-modal-panel">
            <img class="book-modal-cover" id="book-modal-cover" alt="">
            <div class="book-modal-details">
                <h2 class="book-modal-title" id="book-modal-title"></h2>
                <p class="book-modal-meta"><span id="book-modal-author"></span> · <span id="book-modal-year"></span></p>
                <p class="book-modal-description" id="book-modal-description"></p>
                <a class="book-modal-link" id="book-modal-link" target="_blank" rel="noopener"></a>
            </div>
        </div>
    </div>

    <script>
        const bookModal = document.getElementById('book-modal');
        const closeBookModalButton = bookModal.querySelector('.modal-close');
        const bookModalCover = document.getElementById('book-modal-cover');
        const bookModalTitle = document.getElementById('book-modal-title');
        const bookModalAuthor = document.getElementById('book-modal-author');
        const bookModalYear = document.getElementById('book-modal-year');
        const bookModalDescription = document.getElementById('book-modal-description');
        const bookModalLink = document.getElementById('book-modal-link');

        function openBookModal(book) {
            const cover = book.querySelector('img');
            bookModalCover.src = cover.src;
            bookModalCover.alt = cover.alt;
            bookModalTitle.textContent = book.dataset.title;
            bookModalAuthor.textContent = book.dataset.author;
            bookModalYear.textContent = book.dataset.year;
            if (book.dataset.descriptionHtml) {
                bookModalDescription.innerHTML = book.dataset.descriptionHtml;
            } else {
                bookModalDescription.textContent = book.dataset.description;
            }
            bookModalLink.href = book.dataset.link;
            bookModalLink.textContent = book.dataset.linkLabel;
            bookModal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeBookModal() {
            bookModal.classList.remove('show');
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.book').forEach(book => {
            book.addEventListener('click', () => openBookModal(book));
        });

        closeBookModalButton.addEventListener('click', closeBookModal);
        closeBookModalButton.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') {
                closeBookModal();
            }
        });

        bookModal.addEventListener('click', event => {
            if (event.target === bookModal) {
                closeBookModal();
            }
        });

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && bookModal.classList.contains('show')) {
                closeBookModal();
            }
        });
    </script>
    <script src="header.js?v=paintings-64"></script>
    <script>initHeader('tastemaker');</script>
</body>
</html>
